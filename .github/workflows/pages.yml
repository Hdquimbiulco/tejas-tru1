# Publica el sitio en GitHub Pages en cada push a main.
# Además publica cada versión guardada (etiquetas v*) en /versiones/<etiqueta>/
# y una página con la lista en /versiones/ (scripts/versiones.mjs explica cómo
# crear una versión nueva).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # todo el historial y las etiquetas (para las versiones)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /tejas-tru1/
      # Cada etiqueta v* se construye aparte, con su propia carpeta como base
      - name: Construir las versiones guardadas
        run: |
          for etiqueta in $(git tag --list 'v*'); do
            git worktree add --detach "../version-$etiqueta" "$etiqueta"
            (cd "../version-$etiqueta" && npm ci --no-audit --no-fund && VITE_BASE="/tejas-tru1/versiones/$etiqueta/" npm run build)
            mkdir -p "dist/versiones/$etiqueta"
            cp -r "../version-$etiqueta/dist/." "dist/versiones/$etiqueta/"
          done
          node scripts/versiones.mjs dist /tejas-tru1/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
